Identifier: eos43d6
Slug: antimicrobial-activity-mtuberculosis
Status: Ready
Title: Antimicrobial activity prediction against Mycobacterium tuberculosis from
  public ChEMBL and PubChem data
Description: Bioactivity prediction of growth inhibition in Mycobacterium 
  tuberculosis, trained as binary (active/inactive) classifiers from publicly 
  available data in ChEMBL and PubChem. Independent models are trained on 
  multiple bioactivity datasets, corresponding to single-point (Inhibition) and 
  dose-response (MIC) assays, among others. A ranking score is provided for each
  model alongside a combined consensus score.
