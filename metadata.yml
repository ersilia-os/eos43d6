Title: Antimicrobial activity prediction against Mycobacterium tuberculosis from public ChEMBL and PubChem data
Description: Estimates activity against Mycobacterium tuberculosis by combining 34 independent classifiers, each fitted to a distinct pool of bioactivity data drawn from ChEMBL and PubChem. Tuberculosis benefits from far more public screening data than most pathogens, which is why this panel is larger than its counterparts for other organisms, and single-point and dose-response measurements are kept apart throughout. A quality-weighted consensus summarises the panel into one score.
